<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.palisade.Daemon1"/>
    <allow send_destination="org.palisade.Daemon1"/>
  </policy>
  <policy context="default">
    <!-- Allow any user to send messages to the Palisade daemon.
         Fine-grained authorization is handled by polkit at the
         application level, not by D-Bus message policy. -->
    <allow send_destination="org.palisade.Daemon1"/>

    <!-- Allow receiving signals and replies from the daemon -->
    <allow receive_sender="org.palisade.Daemon1"/>
  </policy>
</busconfig>
