<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.palisade.Daemon1"/>
    <allow send_destination="org.palisade.Daemon1"/>
  </policy>
  <policy context="default">
    <!-- Allow any user to call methods on all Palisade daemon interfaces -->
    <allow send_destination="org.palisade.Daemon1"
           send_interface="org.palisade.Daemon1"/>
    <allow send_destination="org.palisade.Daemon1"
           send_interface="org.palisade.Daemon1.Services"/>
    <allow send_destination="org.palisade.Daemon1"
           send_interface="org.palisade.Daemon1.Monitor"/>

    <!-- Standard D-Bus introspection interfaces -->
    <allow send_destination="org.palisade.Daemon1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.palisade.Daemon1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.palisade.Daemon1"
           send_interface="org.freedesktop.DBus.Peer"/>

    <!-- Allow receiving signals and replies from the daemon -->
    <allow receive_sender="org.palisade.Daemon1"/>
  </policy>
</busconfig>
